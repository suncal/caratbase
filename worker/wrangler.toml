name = "caratbase-analytics"
main = "worker.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding       = "DB"
database_name = "caratbase"
database_id   = "8ed35877-6092-4701-89e9-4378f5ed71ba"

[vars]
# Comma separated origins allowed to POST events.
ALLOWED_ORIGINS = "https://caratbase.com,https://www.caratbase.com,https://suncal.github.io,http://localhost:4500"
# DASH_KEY is a secret, NOT a var — set with:  npx wrangler secret put DASH_KEY
